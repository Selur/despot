[build-system]
build-backend = 'mesonpy'
requires = ['meson-python>=0.15']

[project]
name = 'vapoursynth-despot'
dynamic = ['version']
description = 'DeSpot temporal spot/dust removal for VapourSynth and AviSynth+'
readme = 'README.md'
license = {text = 'GPL-2.0-only'}
requires-python = '>=3.8'
dependencies = ['VapourSynth']

[tool.meson-python.args]
setup = ['-Dpython_package=true']

[tool.meson-python.wheel]
exclude = ['*/*.dll.a', '*/*.lib', '*/*.a']
